<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img"><title>共演智课 V4.0 双源备课与页内原生流式播放器架构</title><rect width="1600" height="1300" rx="18" fill="#F3F7FA"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="48" y="54" font-size="26" fill="#0A7D86" font-weight="700">共演智课 · Polyphony V4.0</text><text x="48" y="106" font-size="35" fill="#1D3B54" font-weight="700">双源备课 → 五阶段 Harness → 声明式模组 → 同页融合课堂</text><rect x="48" y="145" width="1504" height="220" rx="13" fill="#FFFFFF" stroke="#CBDAE5"/><text x="74" y="185" font-size="26" fill="#087E87" font-weight="700">01  双源备课接入层  /  Dual-Source Authoring</text><rect x="74" y="207" width="710" height="130" rx="13" fill="#EAF4F5" stroke="#CBDAE5"/><rect x="805" y="207" width="720" height="130" rx="13" fill="#EDF1FC" stroke="#CBDAE5"/><text x="94" y="240" font-size="24" fill="#1D3B54" font-weight="700">📂 导入既有 .ppt / .pptx / .pdf 无损活化</text><text x="94" y="275" font-size="22" fill="#1D3B54" font-weight="400">保留老教师熟悉版式与讲授脉络</text><text x="94" y="310" font-size="22" fill="#1D3B54" font-weight="400">提取 M1..Mk 引文块 + 原页视觉预览</text><text x="825" y="240" font-size="24" fill="#1D3B54" font-weight="700">✨ AI 从零根据专业需求生成原生课件</text><text x="825" y="275" font-size="22" fill="#1D3B54" font-weight="400">课程对象 + 核心重难点 + 课时规模</text><text x="825" y="310" font-size="22" fill="#1D3B54" font-weight="400">合成代码栏 / 表格 / 公式块 + 互动契约</text><rect x="48" y="388" width="1504" height="395" rx="13" fill="#EAF4F5" stroke="#CBDAE5"/><text x="74" y="430" font-size="27" fill="#087E87" font-weight="700">02  五阶段 Agent Harness 编排引擎</text><rect x="74" y="449" width="1452" height="51" rx="13" fill="#15354F" stroke="#CBDAE5"/><text x="95" y="484" font-size="23" fill="#FFFFFF" font-weight="700">开放模型 API Hub · 统一兼容网关 · 模型可替换 · 本地结构化回退有明确标注</text><text x="97" y="540" font-size="23" fill="#1D3B54" font-weight="400">01  原稿结构化 / 教学大纲规划</text><text x="97" y="587" font-size="23" fill="#1D3B54" font-weight="400">02  课堂节奏与卡点配额预算：60s 微卡点 / 3min 思辨破冰</text><text x="97" y="634" font-size="23" fill="#1D3B54" font-weight="400">03  并发合成结构化页块与交互契约</text><text x="97" y="681" font-size="23" fill="#1D3B54" font-weight="700">04  M1..Mk 引文硬溯源 + safe-expr 零 eval 算式校验 + 单次闭环自修复</text><text x="97" y="728" font-size="23" fill="#1D3B54" font-weight="400">05  双轮课堂状态机沙箱试跑：首轮 → 公布 → 分支 → 改答 → 收束</text><rect x="48" y="806" width="1504" height="150" rx="13" fill="#FFFFFF" stroke="#CBDAE5"/><text x="74" y="850" font-size="26" fill="#087E87" font-weight="700">03  模块化交互能力插件总线  /  Modular Activity Protocol Bus</text><text x="74" y="894" font-size="23" fill="#1D3B54" font-weight="700">concept-diagnosis@1  ·  step-fault@1  ·  param-explorer@1  ·  evidence-weighing@1</text><text x="74" y="932" font-size="21" fill="#1D3B54" font-weight="400">纯声明式 JSON 驱动 · 零硬编码学科仿真器 · 统一输入、公布、反馈与速查卡契约</text><rect x="48" y="979" width="1504" height="258" rx="13" fill="#15354F" stroke="#CBDAE5"/><text x="74" y="1024" font-size="26" fill="#FFFFFF" font-weight="700">04  页内原生流式互动课件播放器  /  Native Inline Streaming Slide Player</text><text x="92" y="1073" font-size="23" fill="#E1F2FB" font-weight="700">16:9 教室大屏同页融合：讲义上下文 + 页内实时互动组件，零弹窗</text><text x="92" y="1121" font-size="23" fill="#E1F2FB" font-weight="400">教师同页播控坞：自由翻页不卡死，互动状态逐页归档，底部连续缩略导航</text><text x="92" y="1169" font-size="23" fill="#E1F2FB" font-weight="400">学生手机单页流式同步：同页讲义 + 页内低摩擦作答 + 底部考前速查卡抽屉</text><text x="48" y="1275" font-size="19" fill="#526C7D" font-weight="400">真实运行边界：服务器导入保留 PDF / Office 原页视觉；单文件离线包内置原生实战课件与本地双轮课堂。</text></g></svg>