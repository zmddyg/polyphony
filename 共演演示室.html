:root {
  color-scheme: light;
  --ink: #14213a;

*, *::before, *::after { box-sizing: border-box; }

.icon-button, .plain-button, .text-button, .action-primary {

.icon-button { width: 38px; height: 38px; border: 1px solid transparent; background: transparent; color: var(--muted); flex: none; }

.room-modes label {
  display: grid;

}

.dialog-feedback { margin: 10px 0 0; color: var(--danger); font-size: 13px; line-height: 1.6; }

.recent-room {

  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 50px;
  padding: 8px 9px;
  text-align: left;
  background: transparent;

}
.recent-room:not(:disabled):hover { background: var(--brand-soft); color: var(--brand-dark); }
.recent-room[aria-current="true"] { background: var(--paper); border-color: var(--line); }
.recent-room > span { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.recent-room > svg { flex: none; color: var(--muted); }
.recent-room b { font-size: 13px; }
.recent-room small, .recent-room em { font-size: 12px; font-style: normal; color: var(--muted); }

#toast {
  position: fixed;
  bottom: max(22px, env(safe-area-inset-bottom));
  left: 50%;
  z-index: 20;
  max-width: min(540px, 90vw);
  padding: 10px 16px;
  text-align: center;
  line-height: 1.55;
  font-size: 14px;
  color: #fff;
  background: var(--navy);
  border-radius: 10px;
  box-shadow: 0 6px 22px #14213a2c;

  opacity: 0;
  transform: translate(-50%, 12px);
  transition: opacity .16s, transform .16s;
}

.sys-view header > h1 { margin: 0; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.2; }
.sys-view header > p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 8px 0 23px; }

.manifest-list > div { display: grid; align-content: start; gap: 7px; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; }

@media (max-width: 480px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }

.lecture-presenter-rail {display:grid;gap:12px;position:sticky;top:12px}
.presenter-card {background:#fff;border:1px solid #d6e0ef;border-radius:12px;padding:13px 14px;display:grid;gap:10px}
.presenter-card > header {display:flex;align-items:center;justify-content:space-between;gap:8px}
.presenter-card h3 {margin:0;font-size:.92rem;color:#1b2f52}
.presenter-card > header span {font-size:.76rem;color:#5b6d87}
.presenter-stats {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.presenter-stats > div {display:grid;gap:3px;padding:8px 10px;border-radius:9px;background:#f5f8fd;border:1px solid #e2eaf6}
.presenter-stats span {font-size:.75rem;color:#5b6d87}
.presenter-stats strong {font-size:1.35rem;line-height:1.15;font-variant-numeric:tabular-nums;color:#172b4a}
.presenter-stats strong.has-pulses {color:#b8580a}
.presenter-clock-box {grid-column:1 / -1}
.presenter-clock-controls {display:flex;gap:6px;margin-top:4px}
.presenter-clock-controls button {padding:3px 9px;border:1px solid #cbd7ea;border-radius:6px;background:#fff;color:#2c4266;font-size:.76rem;cursor:pointer}
.presenter-clock-controls button:hover {background:#eef3ff}
.presenter-notes textarea {width:100%;min-height:108px;resize:vertical;padding:9px 10px;border:1px solid #cfd9ea;border-radius:8px;font:inherit;font-size:.86rem;line-height:1.55;color:#172b4a;background:#fbfdff}
.presenter-note-actions {display:flex;justify-content:flex-end}
.presenter-note-actions .plain-button {min-height:34px;padding:4px 12px;font-size:.82rem}
.presenter-next-empty {margin:0;font-size:.84rem;color:#62738c}
.presenter-next-card {display:grid;gap:8px}
.presenter-next-card strong {font-size:.9rem;line-height:1.35;color:#1c2f52}
.presenter-next-card img {display:block;width:100%;height:auto;max-height:170px;object-fit:contain;border:1px solid #dbe4f2;border-radius:7px;background:#f8fafc}
.presenter-next-card p {margin:0;font-size:.8rem;line-height:1.5;color:#4f617a}
.presenter-next-badge {width:fit-content;padding:2px 8px;border-radius:999px;background:#e8f0ff;color:#244cc0;font-size:.74rem;font-weight:650}

.lecture-outline-backdrop {position:fixed;inset:0;z-index:40;background:#101c3480;display:flex;justify-content:flex-start}
.lecture-outline-backdrop[hidden] {display:none}
.lecture-outline-drawer {width:min(420px,92vw);height:100%;background:#fff;box-shadow:6px 0 32px #0f1b333d;display:grid;grid-template-rows:auto minmax(0,1fr)}
.lecture-outline-head {display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #dbe3f0}
.lecture-outline-head h2 {margin:0;font-size:1rem}
.lecture-outline-list {overflow-y:auto;padding:10px;display:grid;gap:6px;align-content:start}
.lecture-outline-empty {margin:14px;color:#5a6b84;font-size:.9rem}
.lecture-outline-item {
  display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;
  width:100%;padding:9px 10px;border:1px solid #e1e8f3;border-radius:9px;background:#fbfdff;text-align:left;cursor:pointer;color:#1a2b49
}
.lecture-outline-item:hover {border-color:#93aef5;background:#f1f5ff}
.lecture-outline-item.is-active {border-color:#3460dc;background:#eaf0ff}
.outline-num {display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:#e7eefb;color:#2749a8;font-size:.8rem;font-weight:700}
.lecture-outline-item.is-active .outline-num {background:#2b55d3;color:#fff}
.outline-main {display:grid;gap:2px;min-width:0}
.outline-main strong {font-size:.88rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline-main small {font-size:.75rem;color:#5d6f89}
.outline-badges {display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.outline-badges em {font-style:normal;font-size:.7rem;font-weight:650;padding:2px 6px;border-radius:999px;white-space:nowrap}
.badge-interact {background:#e5edff;color:#2247b8}
.badge-exp {background:#e2f6f2;color:#0e6c63}
.badge-pulse {background:#fff0dc;color:#9d4e07}

.lecture-pager {position:sticky;bottom:0;justify-content:center;background:#f4f7fbf5;border-top:1px solid #d4deea;backdrop-filter:blur(6px)}
.lecture-pager button,.lecture-bar-actions button,.lecture-backbar button{min-height:44px}
.lecture-pager [data-lecture-action=next]{color:#fff;background:#2456c4;border-color:#2456c4}
.lecture-room--stage {min-height:100vh;max-width:none;padding:0 clamp(12px,3vw,54px) 28px}
.lecture-room--stage .lecture-workspace {padding-inline:0}
.lecture-room--student {min-height:100vh;padding:0 min(4vw,28px) 24px}
.lecture-room--student .lecture-workspace {padding-inline:0}
.lecture-ended {padding:clamp(32px,10vw,120px);text-align:center}.lecture-ended button{margin:6px}
#surface:fullscreen{background:#f4f7fb;overflow:auto;width:100vw;height:100vh}.lecture-backbar{justify-content:space-between}

@media(max-width:979px){

  .lecture-presenter-rail {position:static}
}
@media(max-width:720px){

  .lecture-workspace{padding:0 8px 12px}
  .lecture-bar-actions{gap:5px}
  .lecture-room-bar button{font-size:.84rem;min-height:40px}
  .lecture-pager {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
  .lecture-pager button {min-height:52px;font-size:.95rem;justify-content:center}
  .lecture-pager [data-lecture-action="finish"] {grid-column:1 / -1}
  .lecture-frame{border-radius:8px}
}
