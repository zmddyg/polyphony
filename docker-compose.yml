services:
  polyphony:
    build:
      context: ./studio
    ports:
      - "${PORT:-4188}:4188"
    environment:
      POLYPHONY_ROOM_FILE: "${POLYPHONY_ROOM_FILE:-/data/rooms.sqlite}"
      POLYPHONY_STORAGE: "${POLYPHONY_STORAGE:-sqlite}"
      POLYPHONY_PUBLIC_ORIGIN: "${POLYPHONY_PUBLIC_ORIGIN:-}"
      POLYPHONY_SECURE_COOKIES: "${POLYPHONY_SECURE_COOKIES:-0}"
      POLYPHONY_TEACHER_PASSPHRASE: "${POLYPHONY_TEACHER_PASSPHRASE:-}"
      POLYPHONY_AI_BASE_URL: "${POLYPHONY_AI_BASE_URL:-}"
      POLYPHONY_AI_MODEL: "${POLYPHONY_AI_MODEL:-}"
      POLYPHONY_AI_KEY: "${POLYPHONY_AI_KEY:-}"
      POLYPHONY_AI_OUTPUT_MODE: "${POLYPHONY_AI_OUTPUT_MODE:-json_object}"
      POLYPHONY_FAST_AI_BASE_URL: "${POLYPHONY_FAST_AI_BASE_URL:-}"
      POLYPHONY_FAST_AI_MODEL: "${POLYPHONY_FAST_AI_MODEL:-}"
      POLYPHONY_FAST_AI_KEY: "${POLYPHONY_FAST_AI_KEY:-}"
      POLYPHONY_FAST_AI_OUTPUT_MODE: "${POLYPHONY_FAST_AI_OUTPUT_MODE:-json_object}"
    volumes:
      - polyphony_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4188/api/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  polyphony_data:

